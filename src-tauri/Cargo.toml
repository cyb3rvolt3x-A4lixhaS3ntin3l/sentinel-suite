[package]
name = "sentinel-suite-ui"
version = "0.1.0"
description = "Sentinel Suite desktop shell (Tauri) — wraps same local SPA at 127.0.0.1:8888"
authors = ["Sentinel Suite"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
