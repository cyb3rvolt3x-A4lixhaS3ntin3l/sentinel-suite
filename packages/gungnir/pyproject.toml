[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gungnir"
version = "0.1.0"
description = "Gungnir hunt packs + bridge — Phase C slice1"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["sentinel_core>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
